<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Log In</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <nav class="navbar navbar-expand-lg ">
            <div class="container-fluid">
                <a href="index.html" style="width: 20%;">
                    <img src="Imagenes/Cinemark Hoyts logo.png" class="logo" style="width: 100%; padding-left: 10px;">
                </a>
            </div>
        </nav>
        <div class="container-user">
            <img src="Imagenes/background.png" alt="" class="bg-user">
            <div class="cont-user">
                <i class="fa-solid fa-circle-user log-user"></i>
                <form id="loginForm" class="form-user">
                    <label for="nombre">Nombre de usuario</label>
                    <input type="text" id="nombre" name="nombre" required class="data-user">
                    <br>
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required class="data-user">
                    <br>
                    <div id="loginError" class="login-error" style="display:none; color:#ff4e2f; margin-bottom:10px;"></div>
                    <input type="submit" value="Entrar" class="entrar-user">
                </form>
                <div class="registrarme">
                    <p class="fs-7">¿Todavía no te registraste?</p>
                    <a href="user_registro.html">Registrarme aquí</a>
                </div>
            </div>
            
        </div>


        <script src="auth.js"></script>
        <script>
            document.getElementById("loginForm").addEventListener("submit", (e) => {
                e.preventDefault();
                const nombre = document.getElementById("nombre").value;
                const password = document.getElementById("password").value;
                const error = document.getElementById("loginError");

                if (login(nombre, password)) {
                    window.location.href = "panel.html";
                } else {
                    error.textContent = "Usuario o contraseña incorrectos.";
                    error.style.display = "block";
                }
            });
        </script>
    </body>

</html>
