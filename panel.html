<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mi Cuenta</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <nav class="navbar navbar-expand-lg ">
            <div class="container-fluid">
                <a href="index.html" style="width: 20%;">
                    <img src="Imagenes/Cinemark Hoyts logo.png" class="logo" style="width: 100%; padding-left: 10px;">
                </a>
            </div>
        </nav>
        <div class="container-user">
            <img src="Imagenes/background.png" alt="" class="bg-user">
            <div class="cont-user">
                <i class="fa-solid fa-circle-user log-user"></i>
                <p id="bienvenida" class="fs-5" style="color:#fff; text-align:center; margin: 10px 0;"></p>
                <div class="panel-acciones">
                    <a href="index.html" class="panel-btn panel-btn-secundario">Volver a Cinemark</a>
                    <button id="btnLogout" type="button" class="panel-btn">Cerrar sesión</button>
                </div>
            </div>
        </div>

        <script src="auth.js"></script>
        <script>
            const usuario = usuarioActual();
            if (!usuario) {
                window.location.href = "login.html";
            } else {
                document.getElementById("bienvenida").textContent = "Bienvenido, " + usuario;
            }

            document.getElementById("btnLogout").addEventListener("click", () => {
                logout();
                window.location.href = "login.html";
            });
        </script>
    </body>

</html>
